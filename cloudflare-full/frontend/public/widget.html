<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        :root {
            /* Light mode tokens, mirrored from suganthan.com global.css */
            --color-bg: 255, 255, 255;
            --color-text: 30, 30, 30;
            --color-text-secondary: 108, 108, 108;
            --color-border: 238, 238, 238;
            --color-accent: 44, 94, 156;
            --color-success: 21, 87, 36;
            --color-success-bg: 212, 237, 218;
            --color-success-border: 195, 230, 203;
            --color-error: 114, 28, 36;
            --color-error-bg: 248, 215, 218;
            --color-error-border: 245, 198, 203;
        }

        body.dark {
            /* Dark mode tokens */
            --color-bg: 29, 30, 32;
            --color-text: 218, 218, 219;
            --color-text-secondary: 155, 156, 157;
            --color-border: 51, 51, 51;
            --color-accent: 82, 145, 215;
            --color-success: 198, 239, 206;
            --color-success-bg: 30, 70, 32;
            --color-success-border: 50, 90, 52;
            --color-error: 248, 215, 218;
            --color-error-bg: 88, 33, 39;
            --color-error-border: 108, 53, 59;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            font-size: 17px;
            line-height: 1.6;
            color: rgb(var(--color-text));
            background-color: rgb(var(--color-bg));
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            padding: 8px 0 24px;
            max-width: 100%;
        }

        .header {
            margin-bottom: 16px;
        }

        .comment-count {
            font-size: 0.85rem;
            font-weight: 500;
            color: rgb(var(--color-text-secondary));
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* Form */
        .comment-form {
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: rgb(var(--color-text-secondary));
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.95rem;
            font-family: inherit;
            line-height: 1.5;
            color: rgb(var(--color-text));
            background: rgb(var(--color-bg));
            border: 1px solid rgb(var(--color-border));
            border-radius: 6px;
            transition: border-color 0.15s ease;
        }

        .form-control::placeholder {
            color: rgb(var(--color-text-secondary));
            opacity: 0.7;
        }

        .form-control:focus {
            outline: none;
            border-color: rgb(var(--color-text-secondary));
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 0;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: rgb(var(--color-text-secondary));
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            accent-color: rgb(var(--color-accent));
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-family: inherit;
            font-weight: 500;
            border-radius: 6px;
            border: 1px solid rgb(var(--color-border));
            color: rgb(var(--color-text-secondary));
            background: transparent;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }

        .btn:hover:not(:disabled) {
            color: rgb(var(--color-text));
            border-color: rgb(var(--color-text-secondary));
        }

        .btn-primary {
            background: rgb(var(--color-text));
            color: rgb(var(--color-bg));
            border-color: rgb(var(--color-text));
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.9;
            color: rgb(var(--color-bg));
            border-color: rgb(var(--color-text));
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-link {
            background: transparent;
            border: none;
            color: rgb(var(--color-accent));
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            padding: 0;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .btn-link:hover {
            opacity: 0.8;
        }

        /* Turnstile */
        .form-group .cf-turnstile {
            display: inline-block;
        }

        /* Comments list */
        .comments-list {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .comment {
            padding: 16px 0;
            border-top: 1px solid rgb(var(--color-border));
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .comment-author {
            font-weight: 600;
            font-size: 0.95rem;
            color: rgb(var(--color-text));
        }

        .comment-author.moderator::after {
            content: "Author";
            display: inline-block;
            margin-left: 8px;
            padding: 1px 8px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgb(var(--color-bg));
            background: rgb(var(--color-accent));
            border-radius: 10px;
            vertical-align: 2px;
        }

        .comment-date {
            color: rgb(var(--color-text-secondary));
            font-size: 0.75rem;
        }

        .comment-content {
            margin-bottom: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: rgb(var(--color-text));
            word-wrap: break-word;
        }

        .comment-actions {
            display: flex;
            gap: 12px;
        }

        .replies {
            margin-left: 20px;
            margin-top: 16px;
            padding-left: 16px;
            border-left: 2px solid rgb(var(--color-border));
        }

        .replies .comment {
            border-top: none;
            padding: 12px 0;
        }

        .replies .comment + .comment {
            border-top: 1px solid rgb(var(--color-border));
        }

        .reply-form {
            margin-top: 12px;
            padding: 16px;
            background: rgba(var(--color-text-secondary), 0.04);
            border-radius: 6px;
            display: none;
        }

        /* Messages */
        .loading,
        .empty {
            text-align: center;
            padding: 24px 0;
            color: rgb(var(--color-text-secondary));
            font-size: 0.9rem;
        }

        .error,
        .success {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 14px;
            border: 1px solid;
        }

        .error {
            color: rgb(var(--color-error));
            background: rgb(var(--color-error-bg));
            border-color: rgb(var(--color-error-border));
        }

        .success {
            color: rgb(var(--color-success));
            background: rgb(var(--color-success-bg));
            border-color: rgb(var(--color-success-border));
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .replies {
                margin-left: 8px;
                padding-left: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="comment-count">Loading comments...</div>
        </div>

        <div class="comment-form">
            <form id="comment-form">
                <div class="form-group">
                    <label for="content">Comment</label>
                    <textarea id="content" name="content" class="form-control" required placeholder="Share your thoughts..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="nickname">Name</label>
                        <input type="text" id="nickname" name="nickname" class="form-control" required placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email <span style="font-weight:400;opacity:0.7">(optional)</span></label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com">
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="acceptNotify" name="acceptNotify">
                    <label for="acceptNotify">Email me when someone replies</label>
                </div>

                <div class="form-group">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAADRvnHqwcYsyc_i1" data-theme="auto"></div>
                </div>

                <button type="submit" class="btn btn-primary">Post comment</button>
            </form>
        </div>

        <div id="messages"></div>
        <div id="comments-container">
            <div class="loading">Loading comments...</div>
        </div>
    </div>

    <script>
        class CommentsWidget {
            constructor() {
                this.params = this.getURLParams();
                this.currentPage = 1;
                this.isSubmitting = false;
                this.init();
            }

            getURLParams() {
                const params = new URLSearchParams(window.location.search);
                return {
                    appId: params.get('appId'),
                    pageId: params.get('pageId') || window.location.href,
                    pageUrl: params.get('pageUrl') || window.location.href,
                    pageTitle: params.get('pageTitle') || document.title,
                    theme: params.get('theme') || 'light'
                };
            }

            init() {
                this.applyTheme(this.params.theme);

                // Listen for theme updates from the parent page (Astro layouts
                // dispatch a postMessage when the user toggles light/dark).
                window.addEventListener('message', (e) => {
                    if (e.data && e.data.type === 'comments-theme') {
                        this.applyTheme(e.data.theme);
                    }
                });

                document.getElementById('comment-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.submitComment();
                });

                this.loadComments();
                this.resizeIframe();

                const observer = new MutationObserver(() => this.resizeIframe());
                observer.observe(document.body, { childList: true, subtree: true });
            }

            applyTheme(theme) {
                if (theme === 'dark') {
                    document.body.classList.add('dark');
                } else {
                    document.body.classList.remove('dark');
                }
            }

            async loadComments(page = 1) {
                try {
                    const url = `/api/open/comments?appId=${this.params.appId}&pageId=${encodeURIComponent(this.params.pageId)}&page=${page}`;
                    const response = await fetch(url, {
                        headers: {
                            'X-Timezone-Offset': new Date().getTimezoneOffset().toString()
                        }
                    });

                    if (!response.ok) {
                        throw new Error('Failed to load comments');
                    }

                    const result = await response.json();
                    this.renderComments(result.data);
                    this.currentPage = page;
                } catch (error) {
                    console.error('Error loading comments:', error);
                    this.showError('Failed to load comments. Please try again.');
                }
            }

            renderComments(data) {
                const { commentCount, data: comments } = data;

                document.querySelector('.comment-count').textContent =
                    commentCount === 0 ? 'No comments yet' :
                    commentCount === 1 ? '1 comment' : `${commentCount} comments`;

                const container = document.getElementById('comments-container');

                if (comments.length === 0) {
                    container.innerHTML = '<div class="empty">Be the first to comment.</div>';
                    this.resizeIframe();
                    return;
                }

                const commentsHtml = comments.map((comment) => this.renderComment(comment)).join('');
                container.innerHTML = `<div class="comments-list">${commentsHtml}</div>`;

                container.querySelectorAll('.btn-reply').forEach((btn) => {
                    btn.addEventListener('click', (e) => {
                        const commentId = e.target.dataset.commentId;
                        this.toggleReplyForm(commentId);
                    });
                });

                this.resizeIframe();
            }

            renderComment(comment) {
                const repliesHtml = comment.replies.data.length > 0
                    ? `<div class="replies">${comment.replies.data.map((reply) => this.renderComment(reply)).join('')}</div>`
                    : '';

                const authorClass = comment.moderator_id ? 'comment-author moderator' : 'comment-author';
                const authorName = comment.moderator?.display_name || comment.by_nickname;

                return `
                    <div class="comment" data-comment-id="${comment.id}">
                        <div class="comment-header">
                            <span class="${authorClass}">${authorName}</span>
                            <span class="comment-date">${comment.parsedCreatedAt}</span>
                        </div>
                        <div class="comment-content">${comment.parsedContent}</div>
                        <div class="comment-actions">
                            <button class="btn-link btn-reply" data-comment-id="${comment.id}">Reply</button>
                        </div>
                        <div class="reply-form" id="reply-form-${comment.id}">
                            <form class="reply-form-inner" data-parent-id="${comment.id}">
                                <div class="form-group">
                                    <textarea name="content" class="form-control" placeholder="Write your reply..." required></textarea>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <input type="text" name="nickname" class="form-control" placeholder="Your name" required>
                                    </div>
                                    <div class="form-group">
                                        <input type="email" name="email" class="form-control" placeholder="Email (optional)">
                                    </div>
                                </div>
                                <div class="form-group cf-turnstile-container"></div>
                                <button type="submit" class="btn btn-primary">Post reply</button>
                                <button type="button" class="btn-link" onclick="this.closest('.reply-form').style.display='none'">Cancel</button>
                            </form>
                        </div>
                        ${repliesHtml}
                    </div>
                `;
            }

            toggleReplyForm(commentId) {
                const form = document.getElementById(`reply-form-${commentId}`);
                const isVisible = form.style.display === 'block';

                document.querySelectorAll('.reply-form').forEach((f) => f.style.display = 'none');

                if (!isVisible) {
                    form.style.display = 'block';

                    const formElement = form.querySelector('.reply-form-inner');
                    if (!formElement.dataset.bound) {
                        formElement.dataset.bound = '1';
                        formElement.addEventListener('submit', (e) => {
                            e.preventDefault();
                            this.submitReply(formElement);
                        });
                    }

                    // Render Turnstile on demand only when the reply form opens.
                    const turnstileContainer = form.querySelector('.cf-turnstile-container');
                    if (window.turnstile && turnstileContainer && !turnstileContainer.dataset.rendered) {
                        window.turnstile.render(turnstileContainer, {
                            sitekey: '0x4AAAAAADRvnHqwcYsyc_i1',
                            theme: 'auto',
                        });
                        turnstileContainer.dataset.rendered = '1';
                    }

                    this.resizeIframe();
                }
            }

            async submitComment() {
                if (this.isSubmitting) return;

                const form = document.getElementById('comment-form');
                const formData = new FormData(form);
                const data = Object.fromEntries(formData);

                if (!data.content.trim() || !data.nickname.trim()) {
                    this.showError('Please fill in name and comment.');
                    return;
                }

                const turnstileToken = data['cf-turnstile-response'];
                if (!turnstileToken) {
                    this.showError('Please complete the anti-bot check before posting.');
                    return;
                }

                this.isSubmitting = true;
                const submitBtn = form.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Posting...';

                try {
                    const response = await fetch('/api/open/comments', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            appId: this.params.appId,
                            pageId: this.params.pageId,
                            pageUrl: this.params.pageUrl,
                            pageTitle: this.params.pageTitle,
                            content: data.content,
                            nickname: data.nickname,
                            email: data.email,
                            acceptNotify: data.acceptNotify === 'on',
                            'cf-turnstile-response': turnstileToken
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to post comment');
                    }

                    this.showSuccess('Comment posted. It will appear after moderation.');
                    form.reset();
                    if (window.turnstile) window.turnstile.reset();
                    this.loadComments();
                } catch (error) {
                    console.error('Error posting comment:', error);
                    this.showError('Failed to post comment. Please try again.');
                    if (window.turnstile) window.turnstile.reset();
                } finally {
                    this.isSubmitting = false;
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Post comment';
                }
            }

            async submitReply(form) {
                const formData = new FormData(form);
                const data = Object.fromEntries(formData);
                const parentId = form.dataset.parentId;

                if (!data.content.trim() || !data.nickname.trim()) {
                    this.showError('Please fill in name and reply.');
                    return;
                }

                const turnstileToken = data['cf-turnstile-response'];
                if (!turnstileToken) {
                    this.showError('Please complete the anti-bot check before posting.');
                    return;
                }

                const submitBtn = form.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Posting...';

                try {
                    const response = await fetch('/api/open/comments', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            appId: this.params.appId,
                            pageId: this.params.pageId,
                            pageUrl: this.params.pageUrl,
                            pageTitle: this.params.pageTitle,
                            content: data.content,
                            nickname: data.nickname,
                            email: data.email,
                            parentId: parentId,
                            'cf-turnstile-response': turnstileToken
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to post reply');
                    }

                    this.showSuccess('Reply posted. It will appear after moderation.');
                    form.reset();
                    form.closest('.reply-form').style.display = 'none';
                    this.loadComments();
                } catch (error) {
                    console.error('Error posting reply:', error);
                    this.showError('Failed to post reply. Please try again.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Post reply';
                }
            }

            showMessage(message, type) {
                const container = document.getElementById('messages');
                container.innerHTML = `<div class="${type}">${message}</div>`;
                setTimeout(() => {
                    container.innerHTML = '';
                    this.resizeIframe();
                }, 5000);
                this.resizeIframe();
            }

            showError(message) { this.showMessage(message, 'error'); }
            showSuccess(message) { this.showMessage(message, 'success'); }

            resizeIframe() {
                setTimeout(() => {
                    const height = document.body.scrollHeight;
                    window.parent.postMessage({
                        type: 'cusdis-resize',
                        height: height
                    }, '*');
                }, 100);
            }
        }

        const widget = new CommentsWidget();
    </script>
</body>
</html>
